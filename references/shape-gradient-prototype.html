<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <title>Shape gradient prototype</title>
        <style>
            body {
                background: #111;
                color: #eee;
                font-family:
                    -apple-system,
                    Segoe UI,
                    Arial,
                    sans-serif;
                margin: 0;
                height: 100vh;
                overflow: hidden;
            }
            .wrap {
                display: block;
            }
            canvas {
                border-radius: 12px;
            }
            .controls {
                position: fixed;
                top: 24px;
                right: 24px;
                width: 260px;
                background: rgba(17, 17, 17, 0.85);
                padding: 16px;
                border-radius: 12px;
                max-height: calc(100vh - 48px);
                overflow: auto;
                z-index: 10;
            }
            label {
                font-size: 13px;
                color: #aaa;
            }
            select,
            input[type="range"] {
                width: 100%;
            }
            .row {
                margin-bottom: 14px;
            }
            .row .head {
                display: flex;
                justify-content: space-between;
            }
            .colors {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            input[type="color"] {
                width: 100%;
                height: 32px;
                border: none;
                border-radius: 6px;
                background: none;
            }
            .controls {
                flex: 1;
                min-width: 240px;
            }
            select {
                background: #222;
                color: #eee;
                border: 1px solid #333;
                border-radius: 6px;
                padding: 6px;
            }
            .chk {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 14px;
            }
        </style>
    </head>

        <script>
            const cv = document.getElementById("cv");
            const ctx = cv.getContext("2d");
            const W = 310,
                H = 310;
            const els = {
                mode: document.getElementById("mode"),
                n: document.getElementById("n"),
                opacity: document.getElementById("opacity"),
                opCenter: document.getElementById("opCenter"),
                opEdge: document.getElementById("opEdge"),
                dither: document.getElementById("dither"),
                glass: document.getElementById("glass"),
                refraction: document.getElementById("refraction"),
                outline: document.getElementById("outline"),
                outlineColor: document.getElementById("outlineColor"),
                outlineWidth: document.getElementById("outlineWidth"),
                bands: document.getElementById("bands"),
                blur: document.getElementById("blur"),
                c1: document.getElementById("c1"),
                c2: document.getElementById("c2"),
                c3: document.getElementById("c3"),
                c4: document.getElementById("c4"),
            };
            function hexToRgb(h) {
                const v = parseInt(h.slice(1), 16);
                return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
            }
            function lerp(a, b, t) {
                return a + (b - a) * t;
            }
            function lerpVec(c1, c2, t) {
                return [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
            }
            function stopVec(stops, t) {
                t = Math.max(0, Math.min(1, t));
                const seg = 1 / (stops.length - 1);
                const i = Math.min(stops.length - 2, Math.floor(t / seg));
                const localT = (t - i * seg) / seg;
                return lerpVec(stops[i], stops[i + 1], localT);
            }
            function srgbToLinear(c) {
                c /= 255;
                return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
            }
            function linearToSrgb(c) {
                const v = c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(Math.max(c, 0), 1 / 2.4) - 0.055;
                return v * 255;
            }
            function rgbToOklab(rgb) {
                const r = srgbToLinear(rgb[0]),
                    g = srgbToLinear(rgb[1]),
                    b = srgbToLinear(rgb[2]);
                const l = 0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b;
                const m = 0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b;
                const s = 0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b;
                const l_ = Math.cbrt(l),
                    m_ = Math.cbrt(m),
                    s_ = Math.cbrt(s);
                return [
                    0.2104542553 * l_ + 0.793617785 * m_ - 0.0040720468 * s_,
                    1.9779984951 * l_ - 2.428592205 * m_ + 0.4505937099 * s_,
                    0.0259040371 * l_ + 0.7827717662 * m_ - 0.808675766 * s_,
                ];
            }
            function oklabToRgb(lab) {
                const L = lab[0],
                    a = lab[1],
                    b = lab[2];
                const l_ = L + 0.3963377774 * a + 0.2158037573 * b;
                const m_ = L - 0.1055613458 * a - 0.0638541728 * b;
                const s_ = L - 0.0894841775 * a - 1.291485548 * b;
                const l = l_ * l_ * l_,
                    m = m_ * m_ * m_,
                    s = s_ * s_ * s_;
                const r = 4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s;
                const g = -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s;
                const bb = -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s;
                return [linearToSrgb(r), linearToSrgb(g), linearToSrgb(bb)];
            }
            function squirclePath(cx, cy, a, b, n, scale) {
                const pts = [];
                const steps = 160;
                for (let i = 0; i <= steps; i++) {
                    const th = (i / steps) * Math.PI * 2;
                    const c = Math.cos(th),
                        s = Math.sin(th);
                    const denom = Math.pow(Math.pow(Math.abs(c), n) + Math.pow(Math.abs(s), n), 1 / n);
                    const x = cx + (scale * a * c) / denom;
                    const y = cy + (scale * b * s) / denom;
                    pts.push([x, y]);
                }
                return pts;
            }
            function drawPath(ctx, pts) {
                ctx.beginPath();
                ctx.moveTo(pts[0][0], pts[0][1]);
                for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
                ctx.closePath();
            }
            const bgimg = document.getElementById("bgimg");
            let bgReady = false,
                bgData = null,
                bgW = 0,
                bgH = 0;
            const BG_ZOOM = 1.38;
            function setupBg() {
                const off = document.createElement("canvas");
                off.width = bgimg.naturalWidth;
                off.height = bgimg.naturalHeight;
                const octx = off.getContext("2d");
                octx.drawImage(bgimg, 0, 0);
                bgData = octx.getImageData(0, 0, off.width, off.height);
                bgW = off.width;
                bgH = off.height;
                bgReady = true;
                render();
            }
            if (bgimg.complete && bgimg.naturalWidth) {
                setupBg();
            } else {
                bgimg.addEventListener("load", setupBg);
            }
            function sampleBg(imgX, imgY) {
                const x = Math.max(0, Math.min(bgW - 1, imgX | 0));
                const y = Math.max(0, Math.min(bgH - 1, imgY | 0));
                const i = (y * bgW + x) * 4;
                return [bgData.data[i], bgData.data[i + 1], bgData.data[i + 2]];
            }
            function applyGlassRefraction(cx, cy, a, b, n) {
                const vw = window.innerWidth,
                    vh = window.innerHeight;
                const containScale = Math.min(vw / bgW, vh / bgH);
                const dispScale = containScale * BG_ZOOM;
                const strength = parseInt(els.refraction.value);
                const img = ctx.getImageData(0, 0, W, H);
                const data = img.data;
                for (let y = 0; y < H; y++) {
                    const dy = y - cy;
                    for (let x = 0; x < W; x++) {
                        const dx = x - cx;
                        const idx = (y * W + x) * 4;
                        const a0 = data[idx + 3];
                        if (a0 <= 0) continue;
                        const ndx = dx / a,
                            ndy = dy / b;
                        const m = Math.pow(Math.abs(ndx), n) + Math.pow(Math.abs(ndy), n);
                        const t = Math.min(1, Math.pow(m, 1 / n));
                        const len = Math.sqrt(ndx * ndx + ndy * ndy) || 1e-6;
                        const nxu = ndx / len,
                            nyu = ndy / len;
                        const bend = strength * Math.pow(t, 3);
                        const sampleDx = dx + nxu * bend,
                            sampleDy = dy + nyu * bend;
                        const imgX = bgW / 2 + sampleDx / dispScale;
                        const imgY = bgH / 2 + sampleDy / dispScale;
                        const bg = sampleBg(imgX, imgY);
                        const tintA = a0 / 255;
                        data[idx] = bg[0] * (1 - tintA) + data[idx] * tintA;
                        data[idx + 1] = bg[1] * (1 - tintA) + data[idx + 1] * tintA;
                        data[idx + 2] = bg[2] * (1 - tintA) + data[idx + 2] * tintA;
                        data[idx + 3] = 255;
                    }
                }
                ctx.putImageData(img, 0, 0);
            }
            function render() {
                const mode = els.mode.value;
                const n = parseFloat(els.n.value);
                const globalOpacity = parseInt(els.opacity.value) / 100;
                const centerOp = parseInt(els.opCenter.value) / 100;
                const edgeOp = parseInt(els.opEdge.value) / 100;
                const useDither = els.dither.checked;
                const stopsRgb = [
                    hexToRgb(els.c1.value),
                    hexToRgb(els.c2.value),
                    hexToRgb(els.c3.value),
                    hexToRgb(els.c4.value),
                ];
                const stopsLab = stopsRgb.map(rgbToOklab);
                document.getElementById("nOut").textContent = n.toFixed(1);
                document.getElementById("opOut").textContent = els.opacity.value;
                document.getElementById("opcOut").textContent = els.opCenter.value;
                document.getElementById("opeOut").textContent = els.opEdge.value;
                document.getElementById("refOut").textContent = els.refraction.value;
                document.getElementById("owOut").textContent = els.outlineWidth.value;
                document.getElementById("bOut").textContent = els.bands.value;
                document.getElementById("blOut").textContent = els.blur.value;
                document.getElementById("bandRow").style.display = mode === "approx" ? "block" : "none";
                document.getElementById("blurRow").style.display = mode === "approx" ? "block" : "none";
                const cornerMode = mode === "corner";
                document.getElementById("c1L").textContent = cornerMode ? "Top-left" : "Center";
                document.getElementById("c2L").textContent = cornerMode ? "Top-right" : "Mid";
                document.getElementById("c3L").textContent = cornerMode ? "Bottom-left" : "Mid 2";
                document.getElementById("c4L").textContent = cornerMode ? "Bottom-right" : "Edge";
                ctx.clearRect(0, 0, W, H);
                const cx = W / 2,
                    cy = H / 2,
                    a = W * 0.42,
                    b = H * 0.42;
                if (mode === "approx") {
                    const bands = parseInt(els.bands.value);
                    const blur = parseInt(els.blur.value);
                    const off = document.createElement("canvas");
                    off.width = W;
                    off.height = H;
                    const octx = off.getContext("2d");
                    for (let k = bands; k >= 1; k--) {
                        const t = k / bands;
                        const pts = squirclePath(cx, cy, a, b, n, t);
                        const col = oklabToRgb(stopVec(stopsLab, t));
                        drawPath(octx, pts);
                        octx.fillStyle = `rgb(${col[0] | 0},${col[1] | 0},${col[2] | 0})`;
                        octx.fill();
                    }
                    ctx.filter = `blur(${blur}px)`;
                    ctx.globalAlpha = globalOpacity;
                    ctx.drawImage(off, 0, 0);
                    ctx.filter = "none";
                    ctx.globalAlpha = 1;
                    const outer = squirclePath(cx, cy, a, b, n, 1);
                    ctx.save();
                    ctx.globalCompositeOperation = "destination-in";
                    drawPath(ctx, outer);
                    ctx.fillStyle = "#000";
                    ctx.fill();
                    ctx.restore();
                    const post = ctx.getImageData(0, 0, W, H);
                    const pdata = post.data;
                    for (let y = 0; y < H; y++) {
                        const dy = (y - cy) / b;
                        for (let x = 0; x < W; x++) {
                            const dx = (x - cx) / a;
                            const m = Math.pow(Math.abs(dx), n) + Math.pow(Math.abs(dy), n);
                            const t = Math.min(1, Math.pow(m, 1 / n));
                            const idx = (y * W + x) * 4;
                            pdata[idx + 3] = pdata[idx + 3] * lerp(centerOp, edgeOp, t);
                        }
                    }
                    ctx.putImageData(post, 0, 0);
                } else {
                    const img = ctx.createImageData(W, H);
                    const data = img.data;
                    for (let y = 0; y < H; y++) {
                        const dy = (y - cy) / b;
                        for (let x = 0; x < W; x++) {
                            const dx = (x - cx) / a;
                            const m = Math.pow(Math.abs(dx), n) + Math.pow(Math.abs(dy), n);
                            const t = Math.pow(m, 1 / n);
                            const idx = (y * W + x) * 4;
                            if (t > 1.02) {
                                data[idx + 3] = 0;
                                continue;
                            }
                            let col;
                            if (cornerMode) {
                                const u = (dx + 1) / 2,
                                    v = (dy + 1) / 2;
                                const top = lerpVec(stopsLab[0], stopsLab[1], u);
                                const bot = lerpVec(stopsLab[2], stopsLab[3], u);
                                col = oklabToRgb(lerpVec(top, bot, v));
                            } else {
                                col = oklabToRgb(stopVec(stopsLab, t));
                            }
                            const alpha = t > 1 ? Math.max(0, 1 - (t - 1) / 0.02) : 1;
                            const dn = useDither ? (Math.random() - 0.5) * 1.4 : 0;
                            const posOp = lerp(centerOp, edgeOp, Math.min(1, t));
                            data[idx] = col[0] + dn;
                            data[idx + 1] = col[1] + dn;
                            data[idx + 2] = col[2] + dn;
                            data[idx + 3] = 255 * alpha * globalOpacity * posOp;
                        }
                    }
                    ctx.putImageData(img, 0, 0);
                }
                if (els.glass.checked && bgReady) {
                    applyGlassRefraction(cx, cy, a, b, n);
                }
                if (els.outline.checked) {
                    const outer = squirclePath(cx, cy, a, b, n, 1);
                    ctx.lineJoin = "round";
                    ctx.strokeStyle = els.outlineColor.value;
                    ctx.lineWidth = parseFloat(els.outlineWidth.value);
                    drawPath(ctx, outer);
                    ctx.stroke();
                }
            }
            Object.values(els).forEach((el) => el.addEventListener("input", render));
            window.addEventListener("resize", render);
            render();
        </script>
    </body>
</html>
