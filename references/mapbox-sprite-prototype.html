<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Option A — baked squircle sprites on a Mapbox symbol layer</title>
        <link rel="stylesheet" href="../node_modules/mapbox-gl/dist/mapbox-gl.css" />
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #111;
                color: #eee;
                font-family:
                    -apple-system,
                    Segoe UI,

                    sans-serif;
                overflow: hidden;
            }
            #map {
                position: absolute;
                inset: 0;
            }
            /* Screen-pinned create-mode cursor. One pre-baked canvas per roundness bucket;
     switching buckets is a display flip, never a bake. */
            #center {
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                pointer-events: none;
            }
            #center canvas {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                display: none;
            }
            #overlay {
                position: absolute;
                inset: 0;
                pointer-events: none;
                width: 100%;
                height: 100%;
            }
            .panel {
                position: absolute;
                top: 12px;
                right: 12px;
                width: 296px;
                max-height: calc(100vh - 24px);
                overflow: auto;
                background: rgba(17, 17, 17, 0.92);
                padding: 12px;
                border-radius: 12px;
                z-index: 10;
                font-size: 12px;
            }
            .stats {
                position: absolute;
                top: 12px;
                left: 12px;
                background: rgba(17, 17, 17, 0.9);
                padding: 12px 14px;
                border-radius: 12px;
                z-index: 10;
                font:
                    11px/1.5 ui-monospace,
                    SFMono-Regular,
                    Menlo,
                    monospace;

            }
            details {
                border: 1px solid #2a2a2a;
                border-radius: 8px;
                margin-bottom: 8px;
                background: #171717;
            }
            summary {
                cursor: pointer;
                padding: 7px 10px;
                font-weight: 600;
                color: #ddd;
                user-select: none;
            }
            details[open] summary {
                border-bottom: 1px solid #2a2a2a;
            }
            .body {
                padding: 10px;
            }
            .row {

            }
            .row .head {
                display: flex;
                justify-content: space-between;

    <body>
        <div id="map"></div>
        <div id="center"></div>
        <svg id="overlay"></svg>
        <div id="baking">baking…</div>
        <div class="stats" id="stats">booting…</div>
        <div class="panel" id="panel"></div>

        <div id="gate">
            <div>
                <div style="margin-bottom: 10px">Paste a Mapbox access token (stored in localStorage only):</div>
                <input id="token" placeholder="pk.…" autocomplete="off" />
                <div class="hint">
                    From <code>.env.local</code> → <code>VITE_MAPBOX_TOKEN</code>, or open with
                    <code>?token=pk.…</code>.
                </div>
            </div>
        </div>

        <script src="../node_modules/mapbox-gl/dist/mapbox-gl.js"></script>
        <!-- Optional local-only token file (gitignored); absent by default. -->
        <script src="token.local.js"></script>
        <script>
            /* ================================================================== *
             * CONFIG — every tunable, mirroring src/modules/CreatePatio/constants.ts
             * ================================================================== */
            const CONFIG = {
                metrics: {
                    patioSizeM: 100, // PATIO_SIZE_M
                    cornerRadius: 28, // SQUARE_CORNER_RADIUS
                    radiusBasis: 247, // SQUARE_CORNER_RADIUS_BASIS
                    borderWidth: 4, // SQUARE_BORDER_WIDTH
                    buckets: 6, // roundness ladder resolution
                    nMax: 4, // squircle exponent at design roundness
                    maxSpritePx: 512, // bake size of the largest bucket
                    glowWidth: 0.1, // inner-glow falloff, in normalised t units
                    fillMidOffset: 0.6, // INDICATOR_FILL_MID.offset
                    fillMidRatio: 0.3, // INDICATOR_FILL_MID.opacityRatio
                    sheenRest: 0.04, // INDICATOR_SHEEN.restOpacity
                    sheenA: 0.25,
                    sheenB: 0.005,
                    sheenC: 0.25,
                    sheenPosA: 0.17734,
                    sheenPosB: 0.46843,
                    sheenPosC: 0.82838,
                    hl1A: 0.9,
                    hl1X: 2,
                    hl1Y: 3, // INDICATOR_HIGHLIGHTS[0]
                    hl2A: 0.8,
                    hl2X: -3,
                    hl2Y: -2, // INDICATOR_HIGHLIGHTS[1]
                    dither: true,
                    okRamp: false,
                    pressedRing: false,
                },
                variants: {
                    owned: {
                        gradientEdge: "#0eb838",
                        gradientOpacity: 0.95,
                        insetShadow: "#0eb838",
                        insetOpacity: 0.8,
                        pressedBorder: "#01de37",
                    },
                    "not-published": {
                        gradientEdge: "#007aff",
                        gradientOpacity: 0.95,
                        insetShadow: "#007aff",
                        insetOpacity: 0.7,
                        pressedBorder: "#4ca2ff",
                    },
                    "owned-and-published": {
                        gradientEdge: "#ff9d00",
                        gradientOpacity: 0.95,
                        insetShadow: "#ff9d00",
                        insetOpacity: 0.8,
                        pressedBorder: "#ff9d00",
                    },
                    "owned-and-not-published": {
                        gradientEdge: "#ffe100",
                        gradientOpacity: 0.95,
                        insetShadow: "#ffe100",
                        insetOpacity: 0.8,
                        pressedBorder: "#ffe100",
                    },
                    target: {
                        gradientEdge: "#ff7100",
                        gradientOpacity: 0.95,
                        insetShadow: "#a15e05",
                        insetOpacity: 0.44,
                        pressedBorder: "#ff6a00",
                    },
                },
                intersection: { fill: "#ff0000", fillOpacity: 0.8, border: "#ff0404" },
            };
            const TYPES = Object.keys(CONFIG.variants);
            const PATIO_TYPES = TYPES.filter((t) => t !== "target");
            const EQUATOR_MPP_Z0 = 40075016.686 / 512;
            /**
             * Every sprite reports this many CSS px regardless of the resolution it
             * was baked at, via `pixelRatio = bakedPx / LOGICAL_PX`. `icon-size` has
             * no way to know which bucket's image an icon picked, so if buckets
             * differed in logical size the footprint would stop being 100x100 m —
             * a bucket baked at 128px would render a quarter of the right size.
             */
            const LOGICAL_PX = 256;

            /* ================================================================== *
             * Color helpers (OKLab, from the reference prototype)
             * ================================================================== */
            const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
            const debounce = (fn, ms) => {
                let h;
                return (...a) => {
                    clearTimeout(h);
                    h = setTimeout(() => fn(...a), ms);
                };
            };
            const lerp = (a, b, t) => a + (b - a) * t;
            const hexToRgb = (h) => {
                const v = parseInt(h.slice(1), 16);
                return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
            };
            const srgbToLinear = (c) => {
                c /= 255;
                return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
            };
            const linearToSrgb = (c) => {
                const v = c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(Math.max(c, 0), 1 / 2.4) - 0.055;
                return v * 255;
            };
            function rgbToOklab(rgb) {
                const r = srgbToLinear(rgb[0]),
                    g = srgbToLinear(rgb[1]),
                    b = srgbToLinear(rgb[2]);
                const l = 0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b;
                const m = 0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b;
                const s = 0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b;
                const l_ = Math.cbrt(l),
                    m_ = Math.cbrt(m),
                    s_ = Math.cbrt(s);
                return [
                    0.2104542553 * l_ + 0.793617785 * m_ - 0.0040720468 * s_,
                    1.9779984951 * l_ - 2.428592205 * m_ + 0.4505937099 * s_,
                    0.0259040371 * l_ + 0.7827717662 * m_ - 0.808675766 * s_,
                ];
            }
            function oklabToRgb(lab) {
                const L = lab[0],
                    a = lab[1],
                    b = lab[2];
                const l_ = L + 0.3963377774 * a + 0.2158037573 * b;
                const m_ = L - 0.1055613458 * a - 0.0638541728 * b;
                const s_ = L - 0.0894841775 * a - 1.291485548 * b;
                const l = l_ * l_ * l_,
                    m = m_ * m_ * m_,
                    s = s_ * s_ * s_;
                return [
                    linearToSrgb(4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s),
                    linearToSrgb(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s),
                    linearToSrgb(-0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s),
                ];
            }
            function stopVec(stops, t) {
                t = clamp(t, 0, 1);
                const seg = 1 / (stops.length - 1);
                const i = Math.min(stops.length - 2, Math.floor(t / seg));
                const lt = (t - i * seg) / seg,
                    a = stops[i],
                    b = stops[i + 1];
                return [lerp(a[0], b[0], lt), lerp(a[1], b[1], lt), lerp(a[2], b[2], lt)];
            }
            const DEMO_RAMP = [
                [46, 144, 250],
                [18, 183, 106],
                [247, 144, 9],
                [122, 90, 248],
            ].map(rgbToOklab);

            /* ================================================================== *
             * Roundness ladder
             *
             * The app scales `rx` per frame: getCornerRadius(size) =
             *   clamp(size * cornerRadius/radiusBasis, cornerRadius, size/2)
             * so the radius *ratio* is constant once the square is >= radiusBasis, and
             * grows as the square shrinks below that (a far-out square never squares
             * off; at <= 2*cornerRadius it is a circle).
             *
             * A baked sprite can't vary its roundness, so the ratio is quantised into
             * `buckets` sprites picked with a `step` on zoom. The ratio only varies in
             * the small-square regime, where one bucket step is a couple of pixels.
             * ================================================================== */
            const M = () => CONFIG.metrics;
            const ratioMin = () => M().cornerRadius / M().radiusBasis;
            const cornerRadiusRatio = (sizePx) => clamp(sizePx * ratioMin(), M().cornerRadius, sizePx / 2) / sizePx;
            /* Superellipse exponent for a corner-radius ratio: 0.5 (circle) -> n=2,
            the design ratio -> nMax. */
            function ratioToN(ratio) {
                const k = Math.log(M().nMax / 2) / Math.log(0.5 / ratioMin());
                return clamp(2 * Math.pow(0.5 / clamp(ratio, 1e-3, 0.5), k), 2, 16);
            }
            /* Bucket 0 = roundest (smallest squares), buckets-1 = design roundness. */
            const bucketRatio = (i) => {
                const r0 = ratioMin(),
                    n = M().buckets;
                return r0 + (0.5 - r0) * (1 - i / (n - 1));
            };
            const ratioToSize = (ratio) => M().cornerRadius / ratio;
            /* Each bucket only ever serves squares around its own on-screen size, so it
            is baked at ~2x that (retina) instead of at the max. Cuts bake time and
            atlas footprint by >2x versus baking every bucket at maxSpritePx. */
            function bucketPx(i) {
                const max = M().maxSpritePx;
                if (i === M().buckets - 1) return max; // top bucket is unbounded above
                const want = 2 * ratioToSize(bucketRatio(i));
                return clamp(2 ** Math.ceil(Math.log2(want)), 64, max);
            }
            /** The bucket a square of `sizePx` actually renders with. */
            function sizeToBucket(sizePx) {
                const ratio = cornerRadiusRatio(sizePx);
                let best = 0,
                    bestD = Infinity;
                for (let b = 0; b < M().buckets; b++) {
                    const d = Math.abs(bucketRatio(b) - ratio);
                    if (d < bestD) {
                        bestD = d;
                        best = b;
                    }
                }
                return best;
            }
            /**
             * Squircle exponent *as actually drawn* — quantised to the bucket the sprite
             * came from. The intersection clip must use this, not the ideal continuous
             * curve, or the red overlap is a different shape than the squares it clips.
             * The center square is bucketed the same way, so all three agree.
             */
            const drawnN = (sizePx) => ratioToN(bucketRatio(sizeToBucket(sizePx)));
            const metersToPixels = (m, lat, zoom) =>
                m / ((EQUATOR_MPP_Z0 * Math.cos((lat * Math.PI) / 180)) / 2 ** zoom);
            const zoomForSize = (px, lat) =>
                Math.log2((px * EQUATOR_MPP_Z0 * Math.cos((lat * Math.PI) / 180)) / M().patioSizeM);

            /* ================================================================== *
             * Sprite bake — one analytic pass replaces the whole SVG filter stack
             * ================================================================== */
            /**
             * Time-sliced: a 512px bake is ~50ms and a 1024px one ~194ms as a
             * single task, which hitches the frame whenever a slider moves.
             * Passing `yieldFn` breaks the row loop into ~4ms chunks so no
             * single task blocks a frame.
             */
            async function bakeSprite(variant, n, px, bucketSizePx, yieldFn) {
                const m = M();
                const img = new ImageData(px, px);
                const d = img.data;
                const half = px / 2;
                const edge = hexToRgb(variant.gradientEdge);
                const inset = hexToRgb(variant.insetShadow);
                const insetA = variant.insetOpacity;
                const gOp = variant.gradientOpacity;
                const glowW = m.glowWidth;
                const aa = 1.5 / half;
                // Ring width in normalised t units. A baked ring scales with the square,
                // unlike the app's constant 4px stroke — see the notes in the panel.
                const ringW = m.pressedRing ? (m.borderWidth * 2) / bucketSizePx : 0;
                const ring = m.pressedRing ? hexToRgb(variant.pressedBorder) : null;
                const hl = [
                    { a: m.hl1A, x: m.hl1X, y: m.hl1Y },
                    { a: m.hl2A, x: m.hl2X, y: m.hl2Y },
                ].map((h) => {
                    const len = Math.hypot(h.x, h.y) || 1;
                    return { a: h.a, nx: -h.x / len, ny: -h.y / len };
                });
                const sheenStops = [
                    [m.sheenPosA, m.sheenA],
                    [m.sheenPosB, m.sheenB],
                    [m.sheenPosC, m.sheenC],
                ];

                let sliceStart = performance.now();
                for (let y = 0; y < px; y++) {
                    if (yieldFn && performance.now() - sliceStart > 4) {
                        await yieldFn();
                        sliceStart = performance.now();
                    }
                    const dyn = (y + 0.5 - half) / half;
                    for (let x = 0; x < px; x++) {
                        const dxn = (x + 0.5 - half) / half;
                        const idx = (y * px + x) * 4;

                        // Superellipse distance field. t<1 inside, t=1 on the edge.
                        const mm = Math.pow(Math.abs(dxn), n) + Math.pow(Math.abs(dyn), n);
                        const t = Math.pow(mm, 1 / n);
                        if (t > 1 + aa) {
                            d[idx + 3] = 0;
                            continue;
                        }
                        const cover = t <= 1 - aa ? 1 : clamp((1 + aa - t) / (2 * aa), 0, 1);

                        // --- radial fill: single hue, alpha ramping 0 -> mid -> gradientOpacity
                        let r, g, b, a;
                        if (m.okRamp) {
                            const col = oklabToRgb(stopVec(DEMO_RAMP, t));
                            r = col[0];
                            g = col[1];
                            b = col[2];
                            a = gOp;
                        } else {
                            r = edge[0];
                            g = edge[1];
                            b = edge[2];
                            a =
                                t <= m.fillMidOffset
                                    ? lerp(0, gOp * m.fillMidRatio, t / m.fillMidOffset)
                                    : lerp(gOp * m.fillMidRatio, gOp, (t - m.fillMidOffset) / (1 - m.fillMidOffset));
                        }

                        const eDist = Math.max(0, 1 - t);

                        // --- inner glow: exponential falloff inward from the edge. Replaces
                        // feMorphology + feGaussianBlur + feFlood + 2x feComposite.
                        const glow = Math.exp(-((eDist / glowW) ** 2)) * insetA;
                        if (glow > 0.001) {
                            const na = a + glow * (1 - a);
                            r = (inset[0] * glow + r * a * (1 - glow)) / (na || 1);
                            g = (inset[1] * glow + g * a * (1 - glow)) / (na || 1);
                            b = (inset[2] * glow + b * a * (1 - glow)) / (na || 1);
                            a = na;
                        }

                        // --- white highlights: same edge falloff, gated by the outward normal
                        // so each lights only its own side of the square.
                        const len = Math.hypot(dxn, dyn) || 1e-6;
                        const nx = dxn / len,
                            ny = dyn / len;
                        for (const h of hl) {
                            const facing = Math.max(0, nx * h.nx + ny * h.ny);
                            const w = Math.exp(-((eDist / (glowW * 0.6)) ** 2)) * facing * h.a;
                            if (w <= 0.001) continue;
                            const na = a + w * (1 - a);
                            r = (255 * w + r * a * (1 - w)) / (na || 1);
                            g = (255 * w + g * a * (1 - w)) / (na || 1);
                            b = (255 * w + b * a * (1 - w)) / (na || 1);
                            a = na;
                        }

                        // --- diagonal sheen (222.5deg): top-right and bottom-left bright.
                        const u = clamp(((-dxn + dyn) / 2 + 1) / 2, 0, 1);
                        let sheen;
                        if (u <= sheenStops[0][0]) sheen = sheenStops[0][1];
                        else if (u >= sheenStops[2][0]) sheen = sheenStops[2][1];
                        else if (u <= sheenStops[1][0])
                            sheen = lerp(
                                sheenStops[0][1],
                                sheenStops[1][1],
                                (u - sheenStops[0][0]) / (sheenStops[1][0] - sheenStops[0][0] || 1)
                            );
                        else
                            sheen = lerp(
                                sheenStops[1][1],
                                sheenStops[2][1],
                                (u - sheenStops[1][0]) / (sheenStops[2][0] - sheenStops[1][0] || 1)
                            );
                        sheen *= m.sheenRest;
                        if (sheen > 0.001) {
                            const na = a + sheen * (1 - a);
                            r = (edge[0] * sheen + r * a * (1 - sheen)) / (na || 1);
                            g = (edge[1] * sheen + g * a * (1 - sheen)) / (na || 1);
                            b = (edge[2] * sheen + b * a * (1 - sheen)) / (na || 1);
                            a = na;
                        }

                        // --- pressed ring, hugging the edge from the inside.
                        if (ring && eDist < ringW) {
                            const w = clamp((ringW - eDist) / (ringW * 0.35), 0, 1);
                            const na = a + w * (1 - a);
                            r = (ring[0] * w + r * a * (1 - w)) / (na || 1);
                            g = (ring[1] * w + g * a * (1 - w)) / (na || 1);
                            b = (ring[2] * w + b * a * (1 - w)) / (na || 1);
                            a = na;
                        }

                        const dn = m.dither ? (Math.random() - 0.5) * 1.4 : 0;
                        d[idx] = r + dn;
                        d[idx + 1] = g + dn;
                        d[idx + 2] = b + dn;
                        d[idx + 3] = 255 * a * cover;
                    }
                }
                return img;
            }

            /* Screen-space superellipse ring, for the intersection paths. */
            function squirclePath(cx, cy, half, n, azimuthDeg, steps = 72) {
                const rad = (azimuthDeg * Math.PI) / 180;
                const ca = Math.cos(rad),
                    sa = Math.sin(rad);
                let out = "";
                for (let i = 0; i < steps; i++) {
                    const th = (i / steps) * Math.PI * 2;
                    const c = Math.cos(th),
                        s = Math.sin(th);
                    const den = Math.pow(Math.pow(Math.abs(c), n) + Math.pow(Math.abs(s), n), 1 / n);
                    const lx = (half * c) / den,
                        ly = (half * s) / den;
                    out +=
                        (i ? "L" : "M") +
                        (cx + lx * ca - ly * sa).toFixed(1) +
                        " " +
                        (cy + lx * sa + ly * ca).toFixed(1);
                }
                return out + "Z";
            }

            /* SAT overlap on the bounding squares — broadphase for the intersection
            paint (the squircle is inscribed in the square, so this never misses). */
            function squaresOverlap(a, b) {
                const corners = (q) => {
                    const h = q.size / 2,
                        rad = (q.az * Math.PI) / 180,
                        c = Math.cos(rad),
                        s = Math.sin(rad);
                    return [
                        [-h, -h],
                        [h, -h],
                        [h, h],
                        [-h, h],
                    ].map(([x, y]) => [q.cx + x * c - y * s, q.cy + x * s + y * c]);
                };
                const A = corners(a),
                    B = corners(b),
                    axes = [];
                for (const P of [A, B])
                    for (let i = 0; i < 4; i++) {
                        const p = P[i],
                            q = P[(i + 1) % 4];
                        axes.push([-(q[1] - p[1]), q[0] - p[0]]);
                    }
                return axes.every((ax) => {
                    const proj = (P) => {
                        let mn = Infinity,
                            mx = -Infinity;
                        for (const p of P) {
                            const v = p[0] * ax[0] + p[1] * ax[1];
                            if (v < mn) mn = v;
                            if (v > mx) mx = v;
                        }
                        return [mn, mx];
                    };
                    const [a0, a1] = proj(A),
                        [b0, b1] = proj(B);
                    return a1 >= b0 && b1 >= a0;
                });
            }

            /* ================================================================== *
             * Boot
             * ================================================================== */
            const qsToken = new URLSearchParams(location.search).get("token");
            const token = qsToken || window.__MBX_TOKEN || localStorage.getItem("mbx-token");
            if (token) {
                localStorage.setItem("mbx-token", token);
                start(token);
            } else {
                document.getElementById("token").addEventListener("keydown", (e) => {
                    if (e.key === "Enter" && e.target.value.startsWith("pk.")) {
                        localStorage.setItem("mbx-token", e.target.value.trim());
                        location.reload();
                    }
                });
            }

            function start(tok) {
                document.getElementById("gate").remove();
                mapboxgl.accessToken = tok;

                const ORIGIN = [-73.9857, 40.7484];
                const map = new mapboxgl.Map({
                    container: "map",
                    style: "mapbox://styles/mapbox/satellite-v9",
                    center: ORIGIN,
                    zoom: 17.2,
                    pitch: 0,
                    pitchWithRotate: false,
                    antialias: true,
                });
                window.__map = map;

                const SRC = "patios",
                    LYR = "patio-squares";
                const overlay = document.getElementById("overlay");
                const centerHost = document.getElementById("center");
                const bakingEl = document.getElementById("baking");

                let patios = [];
                let patioCount = 300;
                let bakeMs = 0,
                    atlasPx = 0,
                    bakeGen = 0;
                /** bucket -> pre-rendered canvas of the `target` sprite. Never baked in a frame. */
                let centerCanvases = [];
                let activeBucket = -1;
                /** Bucket the symbol layer is currently pinned to; -1 = not yet set. */
                let layerBucket = 0;

                /* ---------------- data ---------------- */
                function makePatios(n) {
                    let seed = 1337;
                    const rnd = () => {
                        seed = (seed * 1664525 + 1013904223) >>> 0;
                        return seed / 4294967296;
                    };
                    const out = [],
                        side = Math.ceil(Math.sqrt(n));
                    const stepDeg = (M().patioSizeM * 1.4) / 111320;
                    for (let i = 0; i < n; i++) {
                        const gx = (i % side) - side / 2,
                            gy = Math.floor(i / side) - side / 2;
                        out.push({
                            id: "p" + i,
                            lng:
                                ORIGIN[0] +
                                (gx * stepDeg + (rnd() - 0.5) * stepDeg * 0.5) / Math.cos((ORIGIN[1] * Math.PI) / 180),
                            lat: ORIGIN[1] + gy * stepDeg + (rnd() - 0.5) * stepDeg * 0.5,
                            az: rnd() * 90,
                            type: PATIO_TYPES[Math.floor(rnd() * PATIO_TYPES.length)],
                        });
                    }
                    return out;
                }
                const toGeoJSON = (list) => ({
                    type: "FeatureCollection",
                    features: list.map((p) => ({
                        type: "Feature",
                        geometry: { type: "Point", coordinates: [p.lng, p.lat] },
                        properties: {
                            type: p.type,
                            az: p.az,
                            // Zoom expressions can't read feature data, so the latitude term is
                            // baked per feature and multiplied into the zoom ramp's stop values.
                            latFactor: M().patioSizeM / (EQUATOR_MPP_Z0 * Math.cos((p.lat * Math.PI) / 180)),
                        },
                    })),
                });

                /* ---------------- sprites ---------------- */
                const spriteId = (type, bucket) => `sq-${type}-${bucket}`;
                const yieldTask = () =>
                    new Promise((r) => {
                        const c = new MessageChannel();
                        c.port1.onmessage = () => r();
                        c.port2.postMessage(0);
                    });

                /**
                 * Chunked bake: one sprite per task, so a full rebake never blocks a frame.
                 * `only` limits the work to a single variant (a color tweak doesn't touch
                 * the other four). A newer bake cancels an in-flight one via `bakeGen`.
                 */
                async function bakeAll(only) {
                    const gen = ++bakeGen;
                    const t0 = performance.now();
                    bakingEl.style.display = "block";
                    const types = only ? [only] : TYPES;
                    let baked = 0;

                    try {
                        for (const type of types) {
                            for (let bkt = 0; bkt < M().buckets; bkt++) {
                                if (gen !== bakeGen) return; // superseded
                                const px = bucketPx(bkt);
                                const img = await bakeSprite(
                                    CONFIG.variants[type],
                                    ratioToN(bucketRatio(bkt)),
                                    px,
                                    ratioToSize(bucketRatio(bkt)),
                                    yieldTask
                                );
                                if (gen !== bakeGen) return; // superseded mid-sprite
                                const id = spriteId(type, bkt);
                                // pixelRatio normalises every bucket to LOGICAL_PX CSS px,
                                // so icon-size stays one expression and the footprint stays
                                // 100x100 m no matter which bucket is picked.
                                if (map.hasImage(id)) map.removeImage(id);
                                map.addImage(id, img, { pixelRatio: px / LOGICAL_PX });
                                baked += px * px;
                                if (type === "target") {
                                    const cv =
                                        centerCanvases[bkt] ||
                                        (centerCanvases[bkt] = centerHost.appendChild(
                                            document.createElement("canvas")
                                        ));
                                    cv.width = px;
                                    cv.height = px;
                                    cv.getContext("2d").putImageData(img, 0, 0);
                                }
                                await yieldTask();
                            }
                        }
                        // Drop canvases for buckets that no longer exist.
                        for (let i = M().buckets; i < centerCanvases.length; i++) centerCanvases[i]?.remove();
                        centerCanvases.length = M().buckets;
                        activeBucket = -1;
                        if (!only) atlasPx = baked;
                        bakeMs = performance.now() - t0;
                        refreshLayer();
                    } finally {
                        // Always clear the badge, including on the superseded early return.
                        if (gen === bakeGen) bakingEl.style.display = "none";
                    }
                }

                /**
                 * Re-adding the layer is the only reliable way to get updated sprites on
                 * screen. `updateImage` swaps the style image but does not re-lay-out the
                 * symbol bucket, and `setLayoutProperty` with an equal value is a no-op
                 * (mapbox deep-compares and bails), so edited sprites stayed stale.
                 */
                const layerSpec = () => ({
                    id: LYR,
                    type: "symbol",
                    source: SRC,
                    layout: {
                        "icon-image": iconImageExpr(layerBucket),
                        "icon-size": iconSizeExpr(),
                        "icon-rotate": ["get", "az"],
                        "icon-rotation-alignment": "map",
                        "icon-pitch-alignment": "map",
                        "icon-allow-overlap": true,
                        "icon-ignore-placement": true,
                    },
                });

                /**
                 *  Repoint the layer at a new roundness bucket. Deliberately synchronous:
                 * debouncing let the sprites trail the screen-pinned center square for a
                 * frame or two mid-zoom, which is exactly the mismatch this is meant to
                 * remove. It only fires when a bucket boundary is actually crossed — a
                 * handful of times across the whole zoom range — at ~1.4ms each.
                 */
                function syncLayerBucket() {
                    if (!map.getLayer(LYR)) return;
                    map.setLayoutProperty(LYR, "icon-image", iconImageExpr(layerBucket));
                }

                function refreshLayer() {
                    if (!map.getLayer(LYR)) return;
                    map.removeLayer(LYR);
                    map.addLayer(layerSpec());
                }

                /**
                 * `icon-image` names one bucket outright rather than selecting it with a
                 * `step` on zoom.
                 *
                 * The step version quantised differently from the center square: as an
                 * image property it is only re-evaluated at *integer* zooms, while the
                 * screen-pinned center square re-picked its bucket continuously. The two
                 * drifted apart, so the target square's corner radius did not match the
                 * patio squares around it. Naming the bucket explicitly means one
                 * function — `sizeToBucket` — drives the sprites, the center canvas and
                 * the intersection clip paths, so all three agree by construction.
                 */
                const iconImageExpr = (bucket) => ["concat", "sq-", ["get", "type"], "-" + bucket];
                /** Bucket every square on screen currently renders with. */
                const currentBucket = () =>
                    sizeToBucket(metersToPixels(M().patioSizeM, map.getCenter().lat, map.getZoom()));
                const iconSizeExpr = () => {
                    // Exponential base-2 across one stop pair is exactly latFactor*2^z, and
                    // mapbox interpolates *-size in the shader, so it stays continuous.
                    // LOGICAL_PX is constant across buckets and bake sizes (see above),
                    // which is what keeps every square exactly 100x100 m on the ground.
                    const logical = LOGICAL_PX;
                    return [
                        "interpolate",
                        ["exponential", 2],
                        ["zoom"],
                        0,
                        ["/", ["*", ["get", "latFactor"], 1], ["literal", logical]],
                        22,
                        ["/", ["*", ["get", "latFactor"], 2 ** 22], ["literal", logical]],
                    ];
                };

                /* ---------------- per-frame overlay ----------------
              Everything here runs on `render`. It must stay allocation-light and
              must never bake. */
                let overlapCount = 0;
                /** Reusable <g><clipPath><path>… node pool; innerHTML is never touched. */
                const pool = [];
                const svgDefs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
                overlay.appendChild(svgDefs);
                function poolNode(i) {
                    if (pool[i]) return pool[i];
                    const NS = "http://www.w3.org/2000/svg";
                    const clip = document.createElementNS(NS, "clipPath");
                    clip.id = "xclip-" + i;
                    const clipPath = document.createElementNS(NS, "path");
                    clip.appendChild(clipPath);
                    svgDefs.appendChild(clip);
                    const g = document.createElementNS(NS, "g");
                    g.setAttribute("clip-path", `url(#xclip-${i})`);
                    const fill = document.createElementNS(NS, "path");
                    const stroke = document.createElementNS(NS, "path");
                    stroke.setAttribute("fill", "none");
                    g.append(fill, stroke);
                    overlay.appendChild(g);
                    return (pool[i] = { clipPath, g, fill, stroke });
                }

                function drawFrame() {
                    const showCenter = ui.showCenter.checked;
                    const lat = map.getCenter().lat,
                        z = map.getZoom();
                    const cSize = metersToPixels(M().patioSizeM, lat, z);

                    // --- keep the symbol layer on the same bucket the center square and
                    // the clip paths use, so every square's corner radius matches.
                    const want = sizeToBucket(cSize);
                    if (want !== layerBucket) {
                        layerBucket = want;
                        syncLayerBucket();
                    }

                    // --- center square: pick a pre-baked canvas, resize with CSS. No bake.
                    centerHost.style.display = showCenter ? "" : "none";
                    if (showCenter) {
                        const bkt = sizeToBucket(cSize);
                        if (bkt !== activeBucket) {
                            centerCanvases.forEach((c, i) => {
                                if (c) c.style.display = i === bkt ? "block" : "none";
                            });
                            activeBucket = bkt;
                        }
                        centerHost.style.width = cSize + "px";
                        centerHost.style.height = cSize + "px";
                    }

                    // --- intersection paint
                    if (!ui.showX.checked || !showCenter) {
                        if (overlapCount) {
                            pool.forEach((p) => {
                                p.g.style.display = "none";
                            });
                            overlapCount = 0;
                        }
                        return;
                    }
                    const c = map.getContainer(),
                        W = c.clientWidth,
                        H = c.clientHeight;
                    const centerD = squirclePath(W / 2, H / 2, cSize / 2, drawnN(cSize), 0);
                    const centerRect = { cx: W / 2, cy: H / 2, size: cSize, az: 0 };
                    const bearing = map.getBearing();
                    const center = map.getCenter();
                    // Cheap geo cull first: only a handful of patios can touch the cursor, so
                    // never call map.project() for the whole list (that was O(N) per frame).
                    const latPad = (M().patioSizeM * 2) / 111320;
                    const lngPad = latPad / Math.max(0.05, Math.cos((lat * Math.PI) / 180));

                    let i = 0;
                    for (const p of patios) {
                        if (Math.abs(p.lat - center.lat) > latPad || Math.abs(p.lng - center.lng) > lngPad) continue;
                        const pt = map.project([p.lng, p.lat]);
                        const pSize = metersToPixels(M().patioSizeM, p.lat, z);
                        // rotation-alignment:map carries world azimuth; on screen that is az - bearing.
                        const pAz = p.az - bearing;
                        if (!squaresOverlap(centerRect, { cx: pt.x, cy: pt.y, size: pSize, az: pAz })) continue;
                        const node = poolNode(i++);
                        node.clipPath.setAttribute("d", squirclePath(pt.x, pt.y, pSize / 2, drawnN(pSize), pAz));
                        node.fill.setAttribute("d", centerD);
                        node.fill.setAttribute("fill", CONFIG.intersection.fill);
                        node.fill.setAttribute("fill-opacity", CONFIG.intersection.fillOpacity);
                        node.stroke.setAttribute("d", centerD);
                        node.stroke.setAttribute("stroke", CONFIG.intersection.border);
                        node.stroke.setAttribute("stroke-width", M().borderWidth);
                        node.g.style.display = "";
                    }
                    for (let k = i; k < pool.length; k++) pool[k].g.style.display = "none";
                    overlapCount = i;
                }

                /* ---------------- stats ---------------- */
                const statsEl = document.getElementById("stats");
                let frames = 0,
                    lastT = performance.now(),
                    fps = 0;
                let frameAcc = 0,
                    frameN = 0,
                    worst = 0,
                    overlayAcc = 0;
                (function tick() {
                    frames++;
                    const now = performance.now();
                    if (now - lastT >= 500) {
                        fps = (frames * 1000) / (now - lastT);
                        frames = 0;
                        lastT = now;
                        const size = metersToPixels(M().patioSizeM, map.getCenter().lat, map.getZoom());
                        statsEl.textContent =
                            `fps          ${fps.toFixed(1)}\n` +
                            `frame ms     ${(frameN ? frameAcc / frameN : 0).toFixed(2)}  worst ${worst.toFixed(1)}\n` +
                            `overlay ms   ${(frameN ? overlayAcc / frameN : 0).toFixed(2)}\n` +
                            `patios       ${patios.length}\n` +
                            `square px    ${size.toFixed(0)}   bucket ${activeBucket}/${M().buckets - 1}\n` +
                            `zoom         ${map.getZoom().toFixed(2)}\n` +
                            `overlaps     ${overlapCount}\n` +
                            `sprites      ${TYPES.length * M().buckets}\n` +
                            `atlas        ${((atlasPx * 4) / 1048576).toFixed(1)} MB\n` +
                            `bake         ${bakeMs.toFixed(0)} ms`;
                        frameAcc = 0;
                        frameN = 0;
                        overlayAcc = 0;
                        worst = 0;
                    }
                    requestAnimationFrame(tick);
                })();

                /* ---------------- control panel ---------------- */
                const ui = {};
                const rebakeAll = debounce(() => bakeAll(), 130);
                const rebakeOne = debounce((t) => bakeAll(t), 130);
                const refreshLayerDebounced = debounce(() => refreshLayer(), 130);
                const rebuildData = debounce(() => {
                    patios = makePatios(patioCount);
                    map.getSource(SRC)?.setData(toGeoJSON(patios));
                }, 120);

                function slider(host, key, label, min, max, step, onChange, obj) {
                    const row = document.createElement("div");
                    row.className = "row";
                    row.innerHTML = `<div class="head"><label>${label}</label><b></b></div>`;
                    const inp = document.createElement("input");
                    inp.type = "range";
                    inp.min = min;
                    inp.max = max;
                    inp.step = step;
                    inp.value = obj[key];
                    const out = row.querySelector("b");
                    const sync = () => {
                        out.textContent = (+obj[key]).toFixed(step < 1 ? (step < 0.01 ? 3 : 2) : 0);
                    };
                    sync();
                    inp.addEventListener("input", () => {
                        obj[key] = +inp.value;
                        sync();
                        onChange();
                    });
                    row.appendChild(inp);
                    host.appendChild(row);
                    return inp;
                }
                function color(host, key, label, onChange, obj) {
                    const row = document.createElement("div");
                    row.className = "row";
                    row.innerHTML = `<div class="head"><label>${label}</label></div>`;
                    const inp = document.createElement("input");
                    inp.type = "color";
                    inp.value = obj[key];
                    inp.addEventListener("input", () => {
                        obj[key] = inp.value;
                        onChange();
                    });
                    row.appendChild(inp);
                    host.appendChild(row);
                    return inp;
                }
                function check(host, key, label, onChange, obj) {
                    const row = document.createElement("div");
                    row.className = "chk";
                    const inp = document.createElement("input");
                    inp.type = "checkbox";
                    inp.checked = !!obj[key];
                    const lab = document.createElement("label");
                    lab.textContent = label;
                    inp.addEventListener("change", () => {
                        obj[key] = inp.checked;
                        onChange();
                    });
                    row.append(inp, lab);
                    host.appendChild(row);
                    return inp;
                }
                function section(title, open) {
                    const d = document.createElement("details");
                    d.open = !!open;
                    d.innerHTML = `<summary>${title}</summary>`;
                    const body = document.createElement("div");
                    body.className = "body";
                    d.appendChild(body);
                    document.getElementById("panel").appendChild(d);
                    return body;
                }

                // --- Scene
                {
                    const s = section("Scene", true);
                    const row = document.createElement("div");
                    row.className = "row";
                    row.innerHTML = `<div class="head"><label>Patios</label><b>${patioCount}</b></div>`;
                    const inp = document.createElement("input");
                    inp.type = "range";
                    inp.min = 10;
                    inp.max = 3000;
                    inp.step = 10;
                    inp.value = patioCount;
                    inp.addEventListener("input", () => {
                        patioCount = +inp.value;
                        row.querySelector("b").textContent = patioCount;
                        rebuildData();
                    });
                    row.appendChild(inp);
                    s.appendChild(row);
                    ui.showX = check(s, "showX", "Intersection paint", () => {}, { showX: true });
                    ui.showCenter = check(s, "showCenter", "Center square", () => {}, { showCenter: true });
                    const br = document.createElement("div");
                    br.className = "btnrow";
                    const spin = document.createElement("button");
                    spin.textContent = "Stress: spin camera";
                    spin.dataset.on = "0";
                    const zoomStress = document.createElement("button");
                    zoomStress.textContent = "Stress: zoom";
                    zoomStress.dataset.on = "0";
                    br.append(spin, zoomStress);
                    s.appendChild(br);
                    ui.spin = spin;
                    ui.zoomStress = zoomStress;
                }

                // --- Square metrics
                {
                    const s = section("Square metrics", true);
                    slider(
                        s,
                        "patioSizeM",
                        "Patio size (m)",
                        10,
                        400,
                        1,
                        () => {
                            // latFactor lives in the feature data, and the bucket
                            // thresholds are sizes-in-metres, so both need a refresh.
                            rebuildData();
                            refreshLayerDebounced();
                        },
                        M()
                    );
                    slider(
                        s,
                        "cornerRadius",
                        "Corner radius (px)",
                        0,
                        128,
                        1,
                        () => {
                            rebakeAll();
                        },
                        M()
                    );
                    slider(
                        s,
                        "radiusBasis",
                        "Radius basis (px)",
                        64,
                        800,
                        1,
                        () => {
                            rebakeAll();
                        },
                        M()
                    );
                    slider(
                        s,
                        "borderWidth",
                        "Border width (px)",
                        0,
                        16,
                        0.5,
                        () => {
                            rebakeAll();
                        },
                        M()
                    );
                    slider(
                        s,
                        "nMax",
                        "Squircle n @ design",
                        2,
                        16,
                        0.1,
                        () => {
                            rebakeAll();
                        },
                        M()
                    );
                    slider(
                        s,
                        "buckets",
                        "Roundness buckets",
                        2,
                        12,
                        1,
                        () => {
                            rebakeAll();
                        },
                        M()
                    );
                    slider(
                        s,
                        "maxSpritePx",
                        "Max sprite px",
                        128,
                        1024,
                        128,
                        () => {
                            // Only the bake resolution changes; pixelRatio keeps every
                            // bucket at LOGICAL_PX, so icon-size is untouched.
                            rebakeAll();
                        },
                        M()
                    );
                }

                // --- Shading
                {
                    const s = section("Shading");
                    slider(s, "glowWidth", "Inner glow width", 0.01, 0.5, 0.01, rebakeAll, M());
                    slider(s, "fillMidOffset", "Fill mid offset", 0.05, 0.95, 0.01, rebakeAll, M());
                    slider(s, "fillMidRatio", "Fill mid ratio", 0, 1, 0.01, rebakeAll, M());
                    slider(s, "sheenRest", "Sheen rest opacity", 0, 1, 0.01, rebakeAll, M());
                    const g = document.createElement("div");
                    g.className = "grid2";
                    s.appendChild(g);
                    const gl = document.createElement("div"),
                        gr = document.createElement("div");
                    g.append(gl, gr);
                    slider(gl, "sheenA", "Sheen a", 0, 1, 0.005, rebakeAll, M());
                    slider(gr, "sheenPosA", "at", 0, 1, 0.01, rebakeAll, M());
                    slider(gl, "sheenB", "Sheen b", 0, 1, 0.005, rebakeAll, M());
                    slider(gr, "sheenPosB", "at", 0, 1, 0.01, rebakeAll, M());
                    slider(gl, "sheenC", "Sheen c", 0, 1, 0.005, rebakeAll, M());
                    slider(gr, "sheenPosC", "at", 0, 1, 0.01, rebakeAll, M());
                    slider(s, "hl1A", "Highlight 1 alpha", 0, 1, 0.01, rebakeAll, M());
                    const g2 = document.createElement("div");
                    g2.className = "grid2";
                    s.appendChild(g2);
                    const g2l = document.createElement("div"),
                        g2r = document.createElement("div");
                    g2.append(g2l, g2r);
                    slider(g2l, "hl1X", "H1 dx", -12, 12, 0.5, rebakeAll, M());
                    slider(g2r, "hl1Y", "H1 dy", -12, 12, 0.5, rebakeAll, M());
                    slider(s, "hl2A", "Highlight 2 alpha", 0, 1, 0.01, rebakeAll, M());
                    const g3 = document.createElement("div");
                    g3.className = "grid2";
                    s.appendChild(g3);
                    const g3l = document.createElement("div"),
                        g3r = document.createElement("div");
                    g3.append(g3l, g3r);
                    slider(g3l, "hl2X", "H2 dx", -12, 12, 0.5, rebakeAll, M());
                    slider(g3r, "hl2Y", "H2 dy", -12, 12, 0.5, rebakeAll, M());
                    check(s, "dither", "Dither", rebakeAll, M());
                    check(s, "okRamp", "OKLab 4-stop demo ramp", rebakeAll, M());
                    check(s, "pressedRing", "Preview pressed ring", rebakeAll, M());
                }

                // --- Variant colors
                {
                    const s = section("Variant", true);
                    const sel = document.createElement("select");
                    for (const t of TYPES) sel.add(new Option(t, t));
                    s.appendChild(sel);
                    const host = document.createElement("div");
                    s.appendChild(host);
                    let current = TYPES[0];
                    function renderVariant() {
                        host.innerHTML = "";
                        const v = CONFIG.variants[current];
                        const on = () => rebakeOne(current);
                        color(host, "gradientEdge", "Gradient edge", on, v);
                        slider(host, "gradientOpacity", "Gradient opacity", 0, 1, 0.01, on, v);
                        color(host, "insetShadow", "Inner glow color", on, v);
                        slider(host, "insetOpacity", "Inner glow opacity", 0, 1, 0.01, on, v);
                        color(host, "pressedBorder", "Pressed border", on, v);
                    }
                    sel.addEventListener("change", () => {
                        current = sel.value;
                        renderVariant();
                    });
                    renderVariant();
                }

                // --- Intersection
                {
                    const s = section("Intersection");
                    color(s, "fill", "Fill", () => {}, CONFIG.intersection);
                    slider(s, "fillOpacity", "Fill opacity", 0, 1, 0.01, () => {}, CONFIG.intersection);
                    color(s, "border", "Border", () => {}, CONFIG.intersection);
                }

                // --- Export
                {
                    const s = section("Export");
                    const ta = document.createElement("textarea");
                    ta.readOnly = true;
                    const br = document.createElement("div");
                    br.className = "btnrow";
                    const dump = document.createElement("button");
                    dump.textContent = "Dump config";
                    const copy = document.createElement("button");
                    copy.textContent = "Copy";
                    br.append(dump, copy);
                    s.append(br, ta);
                    dump.addEventListener("click", () => {
                        ta.value = JSON.stringify(CONFIG, null, 2);
                    });
                    copy.addEventListener("click", async () => {
                        ta.value = ta.value || JSON.stringify(CONFIG, null, 2);
                        try {
                            await navigator.clipboard.writeText(ta.value);
                            copy.textContent = "Copied";
                            setTimeout(() => {
                                copy.textContent = "Copy";
                            }, 1200);
                        } catch {
                            ta.select();
                        }
                    });
                }

                /* ---------------- wiring ---------------- */
                map.on("load", async () => {
                    await bakeAll();
                    patios = makePatios(patioCount);
                    map.addSource(SRC, { type: "geojson", data: toGeoJSON(patios) });
                    map.addLayer(layerSpec());

                    map.on("render", () => {
                        const t0 = performance.now();
                        drawFrame();
                        const dt = performance.now() - t0;
                        overlayAcc += dt;
                        frameAcc += dt;
                        frameN++;
                        if (dt > worst) worst = dt;
                    });

                    // No moveend handler is needed any more: the bucket is driven from
                    // `drawFrame` via `sizeToBucket`, which already accounts for latitude
                    // through `metersToPixels`.
                });

                /* ---------------- stress ---------------- */
                let spinning = false,
                    spinRaf = 0;
                ui.spin.addEventListener("click", () => {
                    spinning = !spinning;
                    ui.spin.dataset.on = spinning ? "1" : "0";
                    if (!spinning) return cancelAnimationFrame(spinRaf);
                    const t0 = performance.now();
                    (function loop() {
                        if (!spinning) return;
                        const dt = (performance.now() - t0) / 1000;
                        map.jumpTo({ bearing: (dt * 20) % 360 });
                        spinRaf = requestAnimationFrame(loop);
                    })();
                });
                let zooming = false,
                    zoomRaf = 0;
                ui.zoomStress.addEventListener("click", () => {
                    zooming = !zooming;
                    ui.zoomStress.dataset.on = zooming ? "1" : "0";
                    if (!zooming) return cancelAnimationFrame(zoomRaf);
                    const t0 = performance.now();
                    (function loop() {
                        if (!zooming) return;
                        const dt = (performance.now() - t0) / 1000;
                        // Sweeps the whole roundness ladder repeatedly — the case that used to
                        // stall on a synchronous bake inside the render handler.
                        map.jumpTo({ zoom: 16 + Math.sin(dt * 0.8) * 2.2 });
                        zoomRaf = requestAnimationFrame(loop);
                    })();
                });
            }
        </script>
    </body>
</html>
